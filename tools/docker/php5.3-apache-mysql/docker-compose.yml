services:
  web:
    build: .
    container_name: web
    restart: always
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./src:/var/www/html
    networks:
      - net
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:${MYSQL_VERSION:-5.5}
    container_name: mysql
    restart: always
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ${MYSQL_INIT_SQL:-./db/no-init.sql}:/docker-entrypoint-initdb.d/devstack.sql
    networks:
      - net
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 20s
      retries: 8

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "${PMA_PORT:-8081}:80"
    networks:
      - net
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-root}
      PMA_PASSWORD: ${MYSQL_PASSWORD-rootpassword}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  db_data:
    name: ${COMPOSE_STACK}_db_data
    driver: local

networks:
  net:
    name: ${COMPOSE_STACK}_network
    driver: bridge